# MVU 可选正则「折叠显示」：用这三条替换 index-MVU片段.yaml 里的「不发送&隐藏变量更新」。
# 效果：变量更新不发给 AI；聊天里折叠成一行「❖ 变量更新 · N 项」，点开逐条列出改了什么（路径 → 新值）；AI 输出到一半时只显示「变量更新中…」。
# 用法：把 templates/MVU/变量更新.html 复制到 works/<作品>/MVU/变量更新.html（可按作品状态栏风格改 :root 配色），再把下面三条合并进 index.yaml。
# 来源：酒馆助手初始模板的三条折叠正则（2026-10-27 核对）；第三条在萧逸尘卡试点改为 HTML 美化版（2026-10-30）。
扩展字段:
  正则:
    # 不发给 AI：完整的和写到一半的都删掉
    - 正则名称: '[不发送]去除变量更新'
      id: 2d2018ae-c085-4916-af05-6830110a8293
      启用: true
      查找表达式: /<update(?:variable)?>[\s\S]*?(?:<\/update(?:variable)?>|$)/gi
      内容: ''
      来源:
        用户输入: true
        AI输出: true
      作用于:
        仅格式显示: false
        仅格式提示词: true

    # AI 还在输出、标签未闭合时：只显示「变量更新中…」
    - 正则名称: '[折叠]变量更新中'
      id: ea96523f-a1cc-4634-b9d2-f28531adca6c
      启用: true
      查找表达式: /<update(?:variable)?>(?![\s\S]*<\/update(?:variable)?>)[\s\S]*$/gi
      内容: |-

        <details><summary>❖ 变量更新中{{random::.::..::...}}</summary></details>
      来源:
        用户输入: true
        AI输出: true
      作用于:
        仅格式显示: true
        仅格式提示词: false

    # 输出完毕：折叠成一行，点开逐条看改了什么
    - 正则名称: '[美化]变量更新'
      id: 06dec31f-c0a9-456c-8b88-1f9176a73039
      启用: true
      查找表达式: /<update(?:variable)?>([\s\S]*?)<\/update(?:variable)?>/gi
      文件: MVU/变量更新
      来源:
        用户输入: true
        AI输出: true
      作用于:
        仅格式显示: true
        仅格式提示词: false
