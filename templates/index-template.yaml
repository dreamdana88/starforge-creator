# yaml-language-server: $schema=https://testingcf.jsdelivr.net/gh/StageDog/tavern_sync/dist/schema/character.zh.json
# 复制到 works/<作品>/index.yaml。文件路径都相对于本文件，且不带扩展名。
头像: 头像
版本: 0.1.0
作者: ''
备注: ''

第一条消息:
  - 文件: 第一条消息/0

# 有主角色放进角色描述时，由 scripts/fill_description.js 填写，不要手改
角色描述: ''

锚点:
  - &蓝灯前
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 角色定义之前
      顺序: 0
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
  - &蓝灯后
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 角色定义之后
      顺序: 300
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
  - &绿灯后
    启用: true
    插入位置:
      类型: 角色定义之后
      顺序: 250
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true

世界书名称: 与角色卡名称相同
条目:
  # —— 世界（20_创世-世界书）——
  # 第一层 世界基石：顺序 0–50；第二层 运行法则：50–100；第三层 空间骨架：100–200
  - 名称: 世界-${名称}
    <<: *蓝灯前
    插入位置:
      类型: 角色定义之前
      顺序: 10
    文件: 世界书/世界-${名称}

  # 第四层 详细档案（绿灯）：顺序 150–300，必须有关键字
  - 名称: 地点-${名称}
    <<: *绿灯后
    激活策略:
      类型: 绿灯
      关键字:
        - ${关键词1}
        - ${关键词2}
    插入位置:
      类型: 角色定义之后
      顺序: 150
    文件: 世界书/地点-${名称}

  # —— 角色 ——
  # 角色列表（12 模式 A）：多角色卡用，蓝灯常驻，顺序 200，排在角色详情前
  - 名称: 角色列表
    <<: *蓝灯后
    插入位置:
      类型: 角色定义之后
      顺序: 200
    文件: 世界书/角色列表

  # 主角色（10）：放进角色描述的那一位不登记；其余主角色在这里登记
  # 绿灯（多角色卡推荐）：关键字 = 姓名 + 称号 / 昵称，与角色列表里的姓名一致，顺序 300 起
  - 名称: 角色-${主角色名}
    <<: *绿灯后
    激活策略:
      类型: 绿灯
      关键字:
        - ${主角色名}
    插入位置:
      类型: 角色定义之后
      顺序: 300
    文件: 角色/角色-${主角色名}
  # 蓝灯写法：
  # - 名称: 角色-${主角色名}
  #   <<: *蓝灯后
  #   文件: 角色/角色-${主角色名}

  # 配角 / NPC（11）：绿灯，角色定义之后，顺序 250 左右
  - 名称: 角色-${NPC名}
    <<: *绿灯后
    激活策略:
      类型: 绿灯
      关键字:
        - ${NPC名}
    文件: 世界书/角色-${NPC名}

  # —— 文风（23）：蓝灯，作者注释之后 ——
  - 名称: 文风
    <<: *蓝灯后
    插入位置:
      类型: 作者注释之后
      顺序: 100
    文件: 文风
