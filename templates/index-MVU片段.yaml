# MVU 片段：作品启用 MVU（prompts/30–34）时，把下面三段合并进 works/<作品>/index.yaml。
# 来源：酒馆助手初始模板（tavern_helper_combo-latest/初始模板/角色卡）与络络「手写 MVU 变量卡」教程，2026-10-27 核对。
# 正则的替换内容用「内容」或「文件」字段（「替换为」已弃用）。

# ── ① 追加到「条目:」列表末尾 ──────────────────────────────
  - 文件夹: 变量
    条目:
      # 默认初始值；开场白里写了 <initvar> 的开局会忽略它。必须禁用
      - 名称: '[initvar]变量初始化勿开'
        启用: false
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 角色定义之前
          顺序: 14720
        递归:
          不可被其他条目激活: true
          不可激活其他条目: true
        文件: 世界书/变量/initvar

      # 固定内容，放 D1 或 D0（放 D2、D3 会夹在两条 AI 回复之间，AI 可能以为数据过时）
      - 名称: 变量列表
        启用: true
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 指定深度
          角色: 系统
          深度: 0
          顺序: 14720
        递归:
          不可被其他条目激活: true
          不可激活其他条目: true
        文件: 世界书/变量/变量列表

      # 由 32_MVU3 生成；位置不敏感，也可放角色定义前后或 D3、D4
      - 名称: '[mvu_update]变量更新规则'
        启用: true
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 指定深度
          角色: 系统
          深度: 0
          顺序: 14720
        递归:
          不可被其他条目激活: true
          不可激活其他条目: true
        文件: 世界书/变量/变量更新规则

      # 固定内容，放 D0
      - 名称: '[mvu_update]变量输出格式'
        启用: true
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 指定深度
          角色: 系统
          深度: 0
          顺序: 14720
        递归:
          不可被其他条目激活: true
          不可激活其他条目: true
        文件: 世界书/变量/变量输出格式

# ── ② 「扩展字段: 正则:」──────────────────────────────────
扩展字段:
  正则:
    # 默认：隐藏变量更新，既不显示也不发给 AI。想在聊天里折叠显示的，换成 index-MVU折叠正则.yaml
    - 正则名称: 不发送&隐藏变量更新
      id: 2d2018ae-c085-4916-af05-6830110a8293
      启用: true
      查找表达式: /<UpdateVariable>[\s\S]*?</UpdateVariable>/gm
      内容: ''
      来源:
        用户输入: true
        AI输出: true
      作用于:
        仅格式显示: true
        仅格式提示词: true

    # MVU 在每条 AI 回复末尾附加 <StatusPlaceHolderImpl/>；不发给 AI，省 token
    - 正则名称: '[不发送]界面占位符'
      id: 9c4e7a31-5b2d-4f8e-a6c1-3d7b0e2f9a54
      启用: true
      查找表达式: <StatusPlaceHolderImpl/>
      内容: ''
      来源:
        用户输入: false
        AI输出: true
      作用于:
        仅格式显示: false
        仅格式提示词: true

    # 34_MVU5 生成状态栏后启用；内容来自文件
    - 正则名称: '[界面]状态栏'
      id: b50d0bed-ff40-4a25-9ada-14feb4283324
      启用: false
      查找表达式: <StatusPlaceHolderImpl/>
      文件: MVU/状态栏
      来源:
        用户输入: false
        AI输出: true
      作用于:
        仅格式显示: true
        仅格式提示词: false

# ── ③ 「扩展字段: 酒馆助手:」────────────────────────────────
  酒馆助手:
    脚本库:
      - 名称: mvu
        id: 22d70d1f-d0be-4061-911e-d0c57ab55053
        启用: true
        类型: 脚本
        内容: |-
          import 'https://testingcf.jsdelivr.net/gh/MagicalAstrogy/MagVarUpdate/artifact/bundle.js';

      # 内容由 scripts/fill_script.js 从 MVU/变量结构.js 填入，不要手改
      - 名称: 变量结构
        id: f65ab164-4268-4366-8228-16af904c2251
        启用: true
        类型: 脚本
        内容: ''
